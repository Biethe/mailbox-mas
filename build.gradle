plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.h2database:h2:2.2.220'
    implementation 'org.flywaydb:flyway-core:9.22.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'edu.aldermere.university.cli.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add '-parameters'
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

def uniTask(String taskName, String command) {
    tasks.register(taskName, JavaExec) {
        group = 'university'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'edu.aldermere.university.cli.Main'
        systemProperty 'uni.command', command
    }
}

tasks.register('benchmark', JavaExec) {
    group = 'benchmark'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'edu.aldermere.benchmark.BenchmarkMain'
}

tasks.register('reviewBenchmark', JavaExec) {
    group = 'benchmark'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'edu.aldermere.benchmark.review.ReviewMain'
    standardInput = System.in
}
